<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отзывы — админка</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--lime:#B7F34A;--graphite:#17191B;--black:#0D0F10;--silver:#E5E7E5;--steel:#777D78;--line:rgba(229,231,229,0.12);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--black);color:var(--silver);font-family:'Manrope',sans-serif;padding:40px 20px;}
.wrap{max-width:640px;margin:0 auto;}
h1{color:#fff;font-size:28px;margin-bottom:8px;}
.sub{color:var(--steel);font-size:14px;margin-bottom:32px;}
.card{background:var(--graphite);border:1px solid var(--line);border-radius:4px;padding:24px;margin-bottom:16px;}
label{display:block;font-size:13px;color:var(--steel);margin-bottom:14px;}
input,textarea,select{width:100%;margin-top:6px;padding:12px 14px;background:var(--black);border:1px solid var(--line);border-radius:4px;color:#fff;font-size:15px;font-family:inherit;}
textarea{resize:vertical;min-height:70px;}
button{font-family:inherit;cursor:pointer;border:none;}
.btn{background:var(--lime);color:var(--black);padding:13px 22px;font-weight:700;font-size:14px;border-radius:4px;}
.count{font-size:13px;color:var(--steel);margin-bottom:16px;}
.item{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;}
.item-body{flex:1;}
.item-quote{color:#fff;font-size:14px;margin-bottom:6px;}
.item-meta{color:var(--lime);font-size:13px;}
.item-meta span{color:var(--steel);}
.del{background:none;color:#ff8a8a;font-size:13px;font-weight:600;white-space:nowrap;}
.del:hover{text-decoration:underline;}
.empty{color:var(--steel);font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Отзывы клиентов</h1>
  <p class="sub">Добавленные здесь отзывы автоматически появятся на сайте — показываются по 3 с прокруткой, без ограничения по количеству.</p>

  <div class="card">
    <form id="addForm">
      <label>Имя клиента<input type="text" name="name" required></label>
      <label>Пол (иконка на карточке)
        <select name="gender">
          <option value="male">Мужской</option>
          <option value="female">Женский</option>
        </select>
      </label>
      <label>Цель (например: похудение, набор массы)<input type="text" name="goal"></label>
      <label>Текст отзыва<textarea name="quote" required></textarea></label>
      <button class="btn" type="submit" id="addBtn">Добавить отзыв</button>
    </form>
  </div>

  <p class="count" id="count"></p>
  <div id="list"></div>
</div>

<script>
const KEY = 'nikita_testimonials';

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  }catch(e){ return []; }
}
function save(list){ localStorage.setItem(KEY, JSON.stringify(list)); }

function render(){
  const list = load();
  document.getElementById('count').textContent = `Отзывов: ${list.length}`;

  const listEl = document.getElementById('list');
  if(!list.length){
    listEl.innerHTML = '<p class="empty">Пока нет отзывов — на сайте будут показаны заглушки.</p>';
    return;
  }
  listEl.innerHTML = list.map((t, i) => `
    <div class="card item">
      <div class="item-body">
        <div class="item-quote">«${t.quote || ''}»</div>
        <div class="item-meta">${t.name || ''} <span>— ${t.goal || ''}</span></div>
      </div>
      <button class="del" data-i="${i}">Удалить</button>
    </div>
  `).join('');

  listEl.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', () => {
      const list2 = load();
      list2.splice(Number(btn.dataset.i), 1);
      save(list2);
      render();
    });
  });
}

document.getElementById('addForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const list = load();
  const data = new FormData(e.target);
  list.push({
    name: (data.get('name')||'').toString().trim(),
    gender: (data.get('gender')||'male').toString(),
    goal: (data.get('goal')||'').toString().trim(),
    quote: (data.get('quote')||'').toString().trim()
  });
  save(list);
  e.target.reset();
  render();
});

render();
</script>
</body>
</html>
